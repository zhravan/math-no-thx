<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inverse functions | math-no-thx</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../viz/viz.css">
</head>
<body>
  <main class="page">
    <a class="back" href="../">← functions</a>
    <header class="concept-header">
      <p class="eyebrow">01 / Algebra / Functions</p>
      <h1>Inverse functions</h1>
      <p class="lead">A function and its inverse undo each other.</p>
    </header>

    <section class="concept">
      <div class="math-card">
        <p class="label">The function</p>
        <p class="equation" id="function">f(x) = 2x + 1</p>
        <p class="explanation">Swap x and y, then solve for y. The result is the inverse function.</p>
      </div>

      <div class="viz">
        <canvas id="graph" class="viz-canvas"></canvas>
        <div class="viz-controls">
          <div class="viz-control">
            <label for="a">a</label>
            <input id="a" type="number" step="any" value="2">
          </div>
          <div class="viz-control">
            <label for="b">b</label>
            <input id="b" type="number" step="any" value="1">
          </div>
        </div>
      </div>

      <div class="math-card">
        <p class="label">The inverse</p>
        <p class="equation" id="inverse">f⁻¹(x) = 0.5x - 0.5</p>
        <p class="explanation" id="relationship">The two graphs mirror each other across y = x.</p>
      </div>
    </section>
  </main>
  <script type="module" src="./script.js"></script>
</body>
</html>
